<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#081a2c">
<title>Svenska Hockey Manager</title>
<style>
:root{--bg:#07111f;--card:#10233a;--card2:#15304e;--text:#f4f7fb;--muted:#9db0c4;--accent:#2fd17d;--danger:#ff6b6b;--gold:#ffc857;--line:#25415e}
*{box-sizing:border-box} body{margin:0;background:linear-gradient(180deg,#06101c,#0a1b2e 45%,#07111f);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
button,select{font:inherit}.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:92px}.top{position:sticky;top:0;z-index:10;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;background:rgba(7,17,31,.93);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}.puck{width:38px;height:38px;border-radius:50%;background:#111;border:4px solid #506278;box-shadow:inset 0 0 0 2px #000}.brand h1{font-size:18px;margin:0}.brand small{color:var(--muted)}
main{padding:16px}.card{background:linear-gradient(145deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.hero{padding:24px}.hero h2{font-size:30px;margin:0 0 8px}.hero p{color:var(--muted);line-height:1.45}.btn{border:0;border-radius:13px;padding:13px 16px;font-weight:750;background:var(--accent);color:#032515;width:100%;cursor:pointer}.btn.secondary{background:#1c3958;color:white;border:1px solid #315476}.btn.danger{background:var(--danger);color:#351010}.btn:active{transform:scale(.985)}
select{width:100%;padding:14px;border-radius:13px;background:#091a2b;color:white;border:1px solid #3b5975;margin:10px 0 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#0b1c30;border:1px solid var(--line);border-radius:14px;padding:13px}.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--muted)}
h2,h3{margin-top:0}.muted{color:var(--muted)}.pill{display:inline-block;padding:6px 9px;border-radius:999px;background:#0a1c2e;border:1px solid var(--line);font-size:12px;color:#bcd0e3}
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(5,14,25,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);z-index:20}
.nav button{background:none;border:0;color:var(--muted);padding:7px 2px;font-size:11px}.nav button.active{color:var(--accent);font-weight:800}.nav i{display:block;font-style:normal;font-size:20px;margin-bottom:2px}
.player,.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.player:last-child,.row:last-child{border-bottom:0}.rating{min-width:42px;text-align:center;background:#071827;border-radius:10px;padding:7px;font-weight:850;color:var(--gold)}
.pos{width:28px;color:var(--accent);font-weight:800}.player-info{flex:1}.player-info small{color:var(--muted)}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:9px 5px;border-bottom:1px solid var(--line);text-align:right}.table th:nth-child(2),.table td:nth-child(2){text-align:left}.table tr.me{background:rgba(47,209,125,.12)}
.score{font-size:38px;text-align:center;font-weight:900}.matchteams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;gap:8px}.log{max-height:220px;overflow:auto;background:#071827;padding:12px;border-radius:12px;font-size:13px;line-height:1.5}.money{color:var(--gold)}.hidden{display:none!important}.section-title{display:flex;justify-content:space-between;align-items:center}.tiny{font-size:11px;color:var(--muted)}.toast{position:fixed;left:50%;bottom:95px;transform:translateX(-50%);background:#eef7f2;color:#082519;padding:11px 15px;border-radius:12px;font-weight:700;z-index:50;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}
@media(min-width:650px){.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="brand"><div class="puck"></div><div><h1>Svenska Hockey Manager</h1><small id="headerClub">Ny karriär</small></div></div>
</header>
<main id="content"></main>
<nav class="nav hidden" id="nav">
  <button data-page="home"><i>🏠</i>Översikt</button>
  <button data-page="squad"><i>👥</i>Trupp</button>
  <button data-page="match"><i>🏒</i>Match</button>
  <button data-page="table"><i>📊</i>Tabell</button>
  <button data-page="finance"><i>💰</i>Ekonomi</button>
</nav>
</div>
<div class="toast" id="toast"></div>
<script>

const HV71_ROSTER=[
{name:"Felix Sandström",pos:"MV",rating:78,potential:80,age:29},
{name:"Olof Glifford",pos:"MV",rating:73,potential:82,age:21},
{name:"Herman Liv",pos:"MV",rating:70,potential:81,age:20},
{name:"Olle Alsing",pos:"B",rating:78,potential:78,age:30},
{name:"Andreas Borgman",pos:"B",rating:81,potential:81,age:31},
{name:"Hugo Fransson",pos:"B",rating:70,potential:79,age:22},
{name:"Niklas Hansson",pos:"B",rating:80,potential:80,age:31},
{name:"Santeri Hatakka",pos:"B",rating:77,potential:79,age:25},
{name:"Lucas Lagerberg",pos:"B",rating:68,potential:79,age:21},
{name:"Karl Annborn",pos:"B",rating:69,potential:81,age:20},
{name:"Malte Gustafsson",pos:"B",rating:71,potential:83,age:20},
{name:"Jonathan Ang",pos:"HF",rating:83,potential:83,age:28},
{name:"Hampus Eriksson",pos:"C",rating:74,potential:75,age:29},
{name:"Aleksi Heponiemi",pos:"C",rating:81,potential:82,age:27},
{name:"Martin Johnsen",pos:"VF",rating:72,potential:79,age:22},
{name:"Justin Kloos",pos:"C",rating:80,potential:80,age:32},
{name:"Victor Laz",pos:"HF",rating:69,potential:78,age:21},
{name:"Linus Lindström",pos:"C",rating:77,potential:78,age:28},
{name:"William Ignberg Nilsson",pos:"VF",rating:68,potential:80,age:20},
{name:"Nikola Pasic",pos:"HF",rating:76,potential:79,age:25},
{name:"Lukas Rousek",pos:"HF",rating:82,potential:84,age:27},
{name:"Oskar Stål Lyrenäs",pos:"VF",rating:78,potential:79,age:28},
{name:"Riley Woods",pos:"VF",rating:81,potential:81,age:28},
{name:"Jan Mysak",pos:"C",rating:79,potential:83,age:24},
{name:"Noah Philp",pos:"C",rating:80,potential:82,age:28}
];

const TEAMS=[
"Björklöven","Brynäs IF","Djurgårdens IF","Färjestad BK","Frölunda HC","HV71","Linköping HC",
"Luleå Hockey","Malmö Redhawks","Rögle BK","Skellefteå AIK","Timrå IK","Växjö Lakers","Örebro Hockey"
];
const first=["Anton","Elias","William","Lucas","Oscar","Viktor","Noah","Albin","Filip","Leo","Axel","Hugo","Isak","Emil","Nils","Oliver","Adam","Jonathan","Max","Theodor"];
const last=["Andersson","Johansson","Karlsson","Nilsson","Eriksson","Larsson","Olsson","Persson","Lindberg","Berglund","Sjögren","Ekström","Nyström","Hedberg","Lundqvist","Holm","Sandin","Åkesson","Forsberg","Dahl"];
let state=JSON.parse(localStorage.getItem("shm_save")||"null");
let page="home";

function rngSeed(s){let h=2166136261;for(let i=0;i<s.length;i++)h=Math.imul(h^s.charCodeAt(i),16777619);return()=>((h=Math.imul(h^h>>>15,1|h))>>>0)/4294967296}
function makeRoster(team){
 if(team==="HV71"){
   return HV71_ROSTER.map((p,i)=>({
     id:i,
     name:p.name,
     pos:p.pos,
     age:p.age,
     rating:p.rating,
     potential:p.potential,
     form:0,
     shooting:Math.max(55,Math.min(92,p.rating+(p.pos==="MV"?-18:Math.floor(Math.random()*9)-3))),
     skating:Math.max(55,Math.min(92,p.rating+Math.floor(Math.random()*9)-4)),
     passing:Math.max(55,Math.min(92,p.rating+Math.floor(Math.random()*9)-4)),
     defense:Math.max(55,Math.min(92,p.rating+(p.pos==="B"?4:Math.floor(Math.random()*7)-5))),
     physical:Math.max(55,Math.min(92,p.rating+Math.floor(Math.random()*11)-5))
   }));
 }
 const r=rngSeed(team), pos=["MV","MV","B","B","B","B","B","B","C","C","C","C","VF","VF","VF","VF","HF","HF","HF","HF"];
 return pos.map((p,i)=>({id:i,name:first[Math.floor(r()*first.length)]+" "+last[Math.floor(r()*last.length)],pos:p,age:18+Math.floor(r()*18),rating:58+Math.floor(r()*30),potential:62+Math.floor(r()*29),form:0,shooting:55+Math.floor(r()*35),skating:55+Math.floor(r()*35),passing:55+Math.floor(r()*35),defense:55+Math.floor(r()*35),physical:55+Math.floor(r()*35)}));
}
function newGame(team){
 const teams=TEAMS.map((name,i)=>({name,gp:0,w:0,l:0,ot:0,gf:0,ga:0,pts:0,strength:66+((i*7)%15)}));
 state={club:team,round:1,money:12500000,fans:6200,morale:70,roster:makeRoster(team),teams,lastMatch:null,history:[],lineup:[]};
 autoLineup();save();page="home";render();
}
function autoLineup(){state.lineup=[...state.roster].sort((a,b)=>b.rating-a.rating).slice(0,18).map(p=>p.id);save()}
function save(){localStorage.setItem("shm_save",JSON.stringify(state))}
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1800)}
function teamObj(n){return state.teams.find(t=>t.name===n)}
function nextOpponent(){let idx=TEAMS.indexOf(state.club);return TEAMS[(idx+state.round)%TEAMS.length]===state.club?TEAMS[(idx+state.round+1)%TEAMS.length]:TEAMS[(idx+state.round)%TEAMS.length]}
function strength(name){if(name===state.club){let chosen=state.roster.filter(p=>state.lineup.includes(p.id));return chosen.reduce((s,p)=>s+p.rating,0)/(chosen.length||1)+state.morale/20}return teamObj(name).strength}
function goalCount(power){let g=0;for(let i=0;i<7;i++)if(Math.random()<Math.min(.52,.18+power/260))g++;return g}
function simulate(){
 if(state.round>52){toast("Grundserien är färdig!");return}
 const opp=nextOpponent(), home=state.round%2===1, myS=strength(state.club), opS=strength(opp);
 let my=goalCount(myS), other=goalCount(opS);
 if(my===other){if(Math.random()<myS/(myS+opS))my++;else other++}
 const winner=my>other, ot=Math.abs(my-other)===1&&Math.random()<.28;
 const a=teamObj(state.club),b=teamObj(opp);a.gp++;b.gp++;a.gf+=my;a.ga+=other;b.gf+=other;b.ga+=my;
 if(winner){a.w++;a.pts+=ot?2:3;b.l++;if(ot){b.ot++;b.pts++}}else{b.w++;b.pts+=ot?2:3;a.l++;if(ot){a.ot++;a.pts++}}
 // simulate other teams
 TEAMS.filter(x=>x!==state.club&&x!==opp).sort(()=>Math.random()-.5).reduce((pairs,x,i,arr)=>{if(i%2===0){let y=arr[i+1];if(y){let ta=teamObj(x),tb=teamObj(y),ga=goalCount(ta.strength),gb=goalCount(tb.strength);if(ga===gb)ga++;ta.gp++;tb.gp++;ta.gf+=ga;ta.ga+=gb;tb.gf+=gb;tb.ga+=ga;if(ga>gb){ta.w++;ta.pts+=3;tb.l++}else{tb.w++;tb.pts+=3;ta.l++}}}return pairs},[]);
 const attendance=Math.round(state.fans*(.72+Math.random()*.38));const income=attendance*265;
 state.money+=income-380000;state.fans=Math.max(2500,state.fans+(winner?Math.floor(Math.random()*170): -Math.floor(Math.random()*90)));state.morale=Math.max(35,Math.min(95,state.morale+(winner?4:-4)));
 const events=[];let min=4;for(let i=0;i<my+other;i++){min+=Math.floor(Math.random()*10)+3;events.push(`${Math.min(min,59)}:${String(Math.floor(Math.random()*60)).padStart(2,"0")} – ${Math.random()<my/(my+other)?state.club:opp} gör mål!`)}
 state.lastMatch={opp,my,other,home,winner,attendance,income,events:events.sort(()=>Math.random()-.5)};
 state.history.unshift(`${state.club} ${my}–${other} ${opp}`);state.round++;save();render();toast(winner?"Seger!":"Förlust");
}
function reset(){if(confirm("Radera karriären och börja om?")){localStorage.removeItem("shm_save");state=null;document.getElementById("nav").classList.add("hidden");document.getElementById("headerClub").textContent="Ny karriär";render()}}
function money(n){return new Intl.NumberFormat("sv-SE").format(Math.round(n))+" kr"}
function renderStart(){return `<section class="card hero"><span class="pill">Mobilversion 0.2</span><h2>Ta över en svensk hockeyklubb</h2><p>Välj lag, sätt truppen, simulera matcher och slåss om seriesegern. Karriären sparas automatiskt i mobilen.</p><label>Välj klubb</label><select id="teamSelect">${TEAMS.map(t=>`<option>${t}</option>`).join("")}</select><button class="btn" id="startBtn">Starta karriär</button></section><section class="card"><h3>Detta finns nu</h3><p class="muted">HV71 har nu riktig spelartrupp, spelarkort, potential och fem grundegenskaper. Övriga lag använder tills vidare genererade spelare.</p></section>`}
function home(){
 const me=teamObj(state.club),opp=nextOpponent();
 return `<section class="card hero"><span class="pill">Omgång ${Math.min(state.round,52)} av 52</span><h2>${state.club}</h2><p>Du är huvudtränare. Nästa motståndare är <b>${opp}</b>.</p><button class="btn" onclick="page='match';render()">Gå till nästa match</button></section>
 <div class="grid"><div class="stat"><b>${me.pts}</b><span>Poäng</span></div><div class="stat"><b>${me.gp}</b><span>Matcher</span></div><div class="stat"><b>${state.morale}%</b><span>Moral</span></div><div class="stat"><b>${state.fans}</b><span>Supportrar</span></div></div>
 <section class="card"><div class="section-title"><h3>Senaste resultat</h3><span class="tiny">autosparat</span></div>${state.history.length?state.history.slice(0,5).map(x=>`<div class="row"><span>${x}</span></div>`).join(""):`<p class="muted">Ingen match spelad ännu.</p>`}</section>`}
function squad(){
 return `<section class="card"><div class="section-title"><div><h2>Trupp</h2><p class="muted">${state.lineup.length}/18 uttagna</p></div><button class="btn secondary" style="width:auto" onclick="autoLineup();render();toast('Bästa laget uttaget')">Auto</button></div>
 ${[...state.roster].sort((a,b)=>b.rating-a.rating).map(p=>`<div class="player" onclick="showPlayer(${p.id})"><span class="pos">${p.pos}</span><div class="player-info"><b>${p.name}</b><small>${p.age} år • POT ${p.potential||p.rating} ${state.lineup.includes(p.id)?"• UTTAGEN":""}</small></div><span class="rating">${p.rating}</span></div>`).join("")}</section>`}
function showPlayer(id){
 const p=state.roster.find(x=>x.id===id);
 const picked=state.lineup.includes(id);
 document.getElementById("content").innerHTML=`<section class="card hero"><span class="pill">${p.pos} • ${p.age} år</span><h2>${p.name}</h2><div class="grid"><div class="stat"><b>${p.rating}</b><span>OVR</span></div><div class="stat"><b>${p.potential||p.rating}</b><span>Potential</span></div></div></section>
 <section class="card"><h3>Egenskaper</h3>
 <div class="row"><span>Skott</span><b>${p.shooting||p.rating}</b></div>
 <div class="row"><span>Skridskoåkning</span><b>${p.skating||p.rating}</b></div>
 <div class="row"><span>Passningar</span><b>${p.passing||p.rating}</b></div>
 <div class="row"><span>Defensiv</span><b>${p.defense||p.rating}</b></div>
 <div class="row"><span>Fysik</span><b>${p.physical||p.rating}</b></div></section>
 <section class="card"><button class="btn ${picked?"danger":""}" onclick="togglePlayer(${p.id});page='squad';render()">${picked?"Ta bort ur laget":"Ta ut till match"}</button><br><br><button class="btn secondary" onclick="page='squad';render()">Tillbaka till truppen</button></section>`;
 window.scrollTo(0,0)
}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});
render();
</script>
</body>
</html>
