<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>Hockey Manager v0.6</title>
<style>
:root{--bg:#07111f;--card:#10233a;--card2:#15304e;--text:#f4f7fb;--muted:#9db0c4;--accent:#f4c542;--blue:#2f71c1;--line:#294763;--danger:#ff6b6b;--green:#39d98a}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#06101c,#0b1c30);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
button,select{font:inherit} select{width:100%;padding:12px;border-radius:12px;background:#091a2d;color:white;border:1px solid var(--line)}.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:92px}
.top{position:sticky;top:0;z-index:10;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;background:rgba(7,17,31,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(145deg,var(--blue),#16457d);display:grid;place-items:center;color:var(--accent);font-weight:900;border:2px solid var(--accent)}
.brand h1{font-size:18px;margin:0}.brand small{color:var(--muted)}main{padding:16px}
.card{background:linear-gradient(145deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.hero{padding:22px}.hero h2{font-size:29px;margin:6px 0}.muted{color:var(--muted)}.pill{display:inline-block;padding:6px 10px;border-radius:999px;background:#0a1c2e;border:1px solid var(--line);font-size:12px;color:#c8d9e8}
.btn{border:0;border-radius:13px;padding:13px 16px;font-weight:800;background:var(--accent);color:#252000;width:100%}.btn.secondary{background:#1c3958;color:#fff;border:1px solid #3b5e7e}.btn.danger{background:var(--danger);color:#351010}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#091a2d;border:1px solid var(--line);border-radius:14px;padding:13px}.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--muted)}
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(5,14,25,.97);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);z-index:20}
.nav button{background:none;border:0;color:var(--muted);padding:6px 2px;font-size:11px}.nav button.active{color:var(--accent);font-weight:800}.nav i{display:block;font-style:normal;font-size:20px}
.player,.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.player:last-child,.row:last-child{border-bottom:0}.player{cursor:pointer}
.pos{width:30px;font-weight:900;color:var(--accent)}.info{flex:1}.info small{display:block;color:var(--muted);margin-top:2px}.rating{min-width:44px;text-align:center;padding:7px;border-radius:10px;background:#071827;color:var(--accent);font-weight:900}
.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:9px 5px;border-bottom:1px solid var(--line);text-align:right}.table th:nth-child(2),.table td:nth-child(2){text-align:left}.table tr.me{background:rgba(244,197,66,.12)}
.matchteams{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center}.score{font-size:38px;font-weight:900}.log{max-height:250px;overflow:auto;background:#071827;padding:12px;border-radius:12px;font-size:13px;line-height:1.5}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px}.tiny{font-size:11px;color:var(--muted)}.hidden{display:none!important}.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#eef7f2;color:#082519;padding:11px 15px;border-radius:12px;font-weight:800;z-index:50;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1}
.line{padding:10px;border-radius:12px;background:#091a2d;border:1px solid var(--line);margin-bottom:10px}.line b{color:var(--accent)}.livebar{height:10px;background:#071827;border-radius:999px;overflow:hidden;border:1px solid var(--line);margin:10px 0 14px}.livebar span{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--accent));width:0%}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.event-goal{color:var(--accent);font-weight:800}.event-penalty{color:#ff9d66}.event-info{color:#c9d7e5}
@media(min-width:650px){.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><div class="logo">HV</div><div><h1>Hockey Manager</h1><small id="subtitle">Version 0.6</small></div></div></header>
<main id="content"></main>
<nav id="nav" class="nav">
<button data-page="home"><i>🏠</i>Översikt</button>
<button data-page="squad"><i>👥</i>Trupp</button>
<button data-page="lines"><i>🧩</i>Kedjor</button>
<button data-page="match"><i>🏒</i>Match</button>
<button data-page="table"><i>📊</i>Tabell</button>
</nav>
</div>
<div id="toast" class="toast"></div>
<script>
"use strict";

const TEAMS=["HV71","Brynäs IF","Djurgårdens IF","Färjestad BK","Frölunda HC","Linköping HC","Luleå Hockey","Malmö Redhawks","Rögle BK","Skellefteå AIK","Timrå IK","Växjö Lakers","Örebro Hockey","Björklöven"];

const HV71_PLAYERS=[
["Felix Sandström","MV",29,78,80],["Olof Glifford","MV",21,73,83],["Herman Liv","MV",20,70,82],
["Andreas Borgman","B",31,81,81],["Niklas Hansson","B",31,80,80],["Olle Alsing","B",30,78,78],["Santeri Hatakka","B",25,77,80],["Hugo Fransson","B",22,71,80],["Lucas Lagerberg","B",21,69,80],["Karl Annborn","B",20,69,82],["Malte Gustafsson","B",20,71,84],
["Jonathan Ang","HF",28,83,83],["Lukas Rousek","HF",27,82,84],["Riley Woods","VF",28,81,81],["Aleksi Heponiemi","C",27,81,82],["Justin Kloos","C",32,80,80],["Noah Philp","C",28,80,82],["Jan Mysak","C",24,79,84],["Oskar Stål Lyrenäs","VF",28,78,79],["Linus Lindström","C",28,77,78],["Nikola Pasic","HF",25,76,79],["Hampus Eriksson","C",29,74,75],["Martin Johnsen","VF",22,72,80],["Victor Laz","HF",21,69,79],["William Ignberg Nilsson","VF",20,68,81]
].map((p,id)=>({
 id,name:p[0],pos:p[1],age:p[2],overall:p[3],potential:p[4],
 shooting:Math.max(55,Math.min(92,p[3]+((id*3)%9)-4)),
 skating:Math.max(55,Math.min(92,p[3]+((id*5)%11)-5)),
 passing:Math.max(55,Math.min(92,p[3]+((id*7)%9)-4)),
 defense:Math.max(55,Math.min(92,p[3]+(p[1]==="B"?4:-3)+((id*2)%5)-2)),
 physical:Math.max(55,Math.min(92,p[3]+((id*4)%11)-5)),
 morale:70,form:0,gp:0,g:0,a:0
}));

function freshState(){
 return {
  version:"0.6",club:"HV71",round:1,money:14500000,fans:6500,morale:72,
  roster:HV71_PLAYERS.map(p=>({...p})),
  lineup:HV71_PLAYERS.slice().sort((a,b)=>b.overall-a.overall).slice(0,18).map(p=>p.id),
  teams:TEAMS.map((name,i)=>({name,gp:0,w:0,l:0,ot:0,gf:0,ga:0,pts:0,strength:69+(i*7)%14})),
  history:[],lastMatch:null,news:["Välkommen till Hockey Manager. Styrelsen förväntar sig slutspel."],injuries:[],tactic:"balanced",goaliePulled:false,liveMatch:null
 };
}
let state;
try{
 const saved=JSON.parse(localStorage.getItem("hockey_manager_v06")||"null");
 state=saved&&saved.version==="0.6"?saved:freshState();
}catch(e){state=freshState()}
let page="home";

function save(){localStorage.setItem("hockey_manager_v06",JSON.stringify(state))}
function money(n){return new Intl.NumberFormat("sv-SE").format(Math.round(n))+" kr"}
function team(name){return state.teams.find(t=>t.name===name)}
function toast(text){const e=document.getElementById("toast");e.textContent=text;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1700)}
function opponent(){const list=TEAMS.filter(t=>t!=="HV71");return list[(state.round-1)%list.length]}
function selected(){return state.roster.filter(p=>state.lineup.includes(p.id))}
function power(){
 const s=healthySelected(); return s.length?s.reduce((sum,p)=>sum+p.overall,0)/s.length+state.morale/25+tacticBonus():65;
}
function goals(strength){let n=0;for(let i=0;i<8;i++)if(Math.random()<Math.min(.48,.14+strength/310))n++;return n}
function scorePlayer(){
 const eligible=healthySelected().filter(p=>p.pos!=="MV");
 const total=eligible.reduce((s,p)=>s+p.overall,0);
 let r=Math.random()*total;
 for(const p of eligible){r-=p.overall;if(r<=0)return p}
 return eligible[0];
}

function healthySelected(){
 return selected().filter(p=>!state.injuries.some(i=>i.id===p.id&&i.games>0));
}
function addNews(text){
 state.news.unshift(text);
 state.news=state.news.slice(0,12);
}
function tickInjuries(){
 state.injuries.forEach(i=>i.games=Math.max(0,i.games-1));
 state.injuries=state.injuries.filter(i=>i.games>0); normalizeLines();
}
function maybeInjury(){
 if(Math.random()<0.18){
  const candidates=healthySelected().filter(p=>p.pos!=="MV");
  if(candidates.length){
   const p=candidates[Math.floor(Math.random()*candidates.length)];
   const games=1+Math.floor(Math.random()*4);
   state.injuries.push({id:p.id,games}); normalizeLines();
   addNews(`${p.name} skadad och missar cirka ${games} matcher.`);
   return `${p.name} lämnar matchen skadad.`;
  }
 }
 return null;
}

function createLiveMatch(){
 if(state.round>52){toast("Grundserien är färdig");return}
 normalizeLines();
 tickInjuries();
 const opp=opponent();
 state.liveMatch={
   opp,minute:0,second:0,period:1,scoreHV:0,scoreOpp:0,shotsHV:0,shotsOpp:0,
   penaltiesHV:0,penaltiesOpp:0,ppHV:0,ppOpp:0,events:[],running:false,finished:false,
   speed:1,timeoutUsed:false,goaliePulled:false,momentum:50,lastEventMinute:-1
 };
 addLiveEvent("Nedsläpp i Husqvarna Garden.","info");
 save();render();
}
function addLiveEvent(text,type="info"){
 const lm=state.liveMatch;
 const time=`${lm.minute}:${String(lm.second).padStart(2,"0")}`;
 lm.events.unshift({time,text,type});
 lm.events=lm.events.slice(0,80);
}
function chooseScorer(){
 const eligible=healthySelected().filter(p=>p.pos!=="MV");
 const total=eligible.reduce((s,p)=>s+p.overall,0)||1;
 let r=Math.random()*total;
 for(const p of eligible){r-=p.overall;if(r<=0)return p}
 return eligible[0];
}
function liveStep(){
 const lm=state.liveMatch;
 if(!lm||!lm.running||lm.finished)return;
 const step=lm.speed===3?30:lm.speed===2?15:8;
 lm.second+=step;
 while(lm.second>=60){lm.second-=60;lm.minute++}
 if(lm.minute>=20&&lm.period===1){lm.period=2;lm.minute=0;lm.second=0;lm.running=false;addLiveEvent("Första perioden är slut.","info");save();render();return}
 if(lm.minute>=20&&lm.period===2){lm.period=3;lm.minute=0;lm.second=0;lm.running=false;addLiveEvent("Andra perioden är slut.","info");save();render();return}
 if(lm.minute>=20&&lm.period===3){finishLiveMatch();return}

 const hvAttack=(power()+lm.momentum/25+(state.tactic==="attack"?3:state.tactic==="defense"?-2:0)+(lm.goaliePulled?4:0));
 const oppAttack=(team(lm.opp).strength+(100-lm.momentum)/25+(state.tactic==="attack"?2:state.tactic==="defense"?-2:0)+(lm.goaliePulled?6:0));
 const total=hvAttack+oppAttack;
 const hvChance=hvAttack/total;

 if(Math.random()<0.22){
   const hv=Math.random()<hvChance;
   if(hv)lm.shotsHV++;else lm.shotsOpp++;
   const quality=Math.random();
   if(quality<0.105+(hv?hvAttack:oppAttack)/900){
      if(hv){
        lm.scoreHV++;
        const scorer=chooseScorer();
        if(scorer){scorer.g++; scorer.gp=Math.max(1,scorer.gp)}
        addLiveEvent(`MÅL HV71! ${scorer?scorer.name:"Okänd målskytt"}.`,"goal");
        lm.momentum=Math.min(80,lm.momentum+9);
      }else{
        lm.scoreOpp++;
        addLiveEvent(`MÅL ${lm.opp}!`,"goal");
        lm.momentum=Math.max(20,lm.momentum-9);
      }
   }else if(quality<0.35){
      addLiveEvent(hv?"HV71 skapar en farlig målchans.":`${lm.opp} är nära att göra mål.`,"info");
      lm.momentum=Math.max(20,Math.min(80,lm.momentum+(hv?3:-3)));
   }
 }
 if(Math.random()<0.035){
   const hvPenalty=Math.random()>hvChance;
   if(hvPenalty){lm.penaltiesHV++;lm.ppOpp++;addLiveEvent("HV71 får en tvåminutersutvisning.","penalty")}
   else{lm.penaltiesOpp++;lm.ppHV++;addLiveEvent(`${lm.opp} får en tvåminutersutvisning.`,"penalty")}
 }
 if(Math.random()<0.025){
   addLiveEvent(lm.momentum>58?"HV71 har ett tydligt tryck just nu.":lm.momentum<42?`${lm.opp} pressar tillbaka HV71.`:"Matchbilden är jämn.","info");
 }
 save();renderLiveOnly();
}
function startLive(){
 if(!state.liveMatch||state.liveMatch.finished)createLiveMatch();
 state.liveMatch.running=true;save();render();scheduleLive();
}
function pauseLive(){if(state.liveMatch){state.liveMatch.running=false;save();render()}}
function scheduleLive(){
 const lm=state.liveMatch;
 if(!lm||!lm.running||lm.finished)return;
 const delay=lm.speed===3?180:lm.speed===2?350:700;
 setTimeout(()=>{liveStep();scheduleLive()},delay);
}
function setSpeed(v){if(state.liveMatch){state.liveMatch.speed=Number(v);save();render()}}
function useTimeout(){
 const lm=state.liveMatch;if(!lm||lm.timeoutUsed)return;
 lm.timeoutUsed=true;lm.running=false;lm.momentum=Math.min(72,lm.momentum+8);
 addLiveEvent("HV71 tar timeout. Spelarna samlar sig.","info");save();render();toast("Timeout använd");
}
function toggleGoaliePull(){
 const lm=state.liveMatch;if(!lm)return;
 lm.goaliePulled=!lm.goaliePulled;
 addLiveEvent(lm.goaliePulled?"HV71 tar ut målvakten!":"HV71 sätter tillbaka målvakten.","info");
 save();render();
}
function changeLiveTactic(value){
 state.tactic=value;
 if(state.liveMatch)addLiveEvent(`HV71 ändrar taktik till ${tacticLabel().toLowerCase()}.`,"info");
 save();render();
}
function finishLiveMatch(){
 const lm=state.liveMatch;
 lm.running=false;lm.finished=true;
 if(lm.scoreHV===lm.scoreOpp){
   if(Math.random()<power()/(power()+team(lm.opp).strength)){lm.scoreHV++;addLiveEvent("HV71 avgör efter förlängning!","goal")}
   else{lm.scoreOpp++;addLiveEvent(`${lm.opp} avgör efter förlängning.`,"goal")}
 }
 const win=lm.scoreHV>lm.scoreOpp;
 healthySelected().forEach(p=>p.gp++);
 const injuryEvent=maybeInjury();if(injuryEvent)addLiveEvent(injuryEvent,"penalty");
 const a=team("HV71"),b=team(lm.opp);a.gp++;b.gp++;a.gf+=lm.scoreHV;a.ga+=lm.scoreOpp;b.gf+=lm.scoreOpp;b.ga+=lm.scoreHV;
 if(win){a.w++;a.pts+=3;b.l++;state.morale=Math.min(95,state.morale+4);state.fans+=90}
 else{b.w++;b.pts+=3;a.l++;state.morale=Math.max(35,state.morale-4);state.fans=Math.max(3000,state.fans-45)}
 const attendance=Math.round(state.fans*(.78+Math.random()*.22));const income=attendance*285;
 state.money+=income-420000;
 state.lastMatch={
   opp:lm.opp,my:lm.scoreHV,them:lm.scoreOpp,win,
   events:lm.events.slice().reverse().map(e=>`${e.time} – ${e.text}`),
   attendance,income,shotsHV:lm.shotsHV,shotsOpp:lm.shotsOpp,ppHV:lm.ppHV,ppOpp:lm.ppOpp
 };
 state.history.unshift(`HV71 ${lm.scoreHV}–${lm.scoreOpp} ${lm.opp}`);
 addNews(win?`HV71 besegrade ${lm.opp} med ${lm.scoreHV}–${lm.scoreOpp}.`:`HV71 föll mot ${lm.opp} med ${lm.scoreHV}–${lm.scoreOpp}.`);
 state.round++;
 state.liveMatch=null;
 save();render();toast(win?"Seger!":"Förlust");
}
function renderLiveOnly(){if(page==="match")render()}

function toggle(id){
 const ix=state.lineup.indexOf(id);
 if(ix>=0){state.lineup.splice(ix,1)}
 else if(state.lineup.length<18){state.lineup.push(id)}
 else{toast("Max 18 spelare");return}
 save();render();
}
function resetGame(){
 if(confirm("Radera karriären och börja om?")){state=freshState();save();page="home";render()}
}
function homeView(){
 const me=team("HV71");
 return `<section class="card hero"><span class="pill">Omgång ${Math.min(state.round,52)} av 52</span><h2>HV71</h2><p class="muted">Nästa match: <b>${opponent()}</b>. Din karriär sparas automatiskt på mobilen.</p><button class="btn" onclick="page='match';render()">Till nästa match</button></section>
 <div class="grid"><div class="stat"><b>${me.pts}</b><span>Poäng</span></div><div class="stat"><b>${me.gp}</b><span>Matcher</span></div><div class="stat"><b>${state.morale}%</b><span>Lagets moral</span></div><div class="stat"><b>${state.fans}</b><span>Supportrar</span></div></div>
 <section class="card"><h3>Nyheter i v0.6</h3><p class="muted">Live-matcher med paus, tre perioder, matchhändelser, timeout, taktikbyte, kedjeändringar och tom kasse.</p></section><section class="card"><h3>Managerstatus</h3><div class="row"><span>Matchtaktik</span><b>${tacticLabel()}</b></div><div class="row"><span>Uttagen trupp</span><b>${state.lineup.length}/18</b></div><div class="row"><span>Skadade</span><b>${state.injuries.length}</b></div></section><section class="card"><div class="section-title"><h3>Senaste resultat</h3><span class="tiny">v0.6</span></div>${state.history.length?state.history.slice(0,5).map(x=>`<div class="row"><span>${x}</span></div>`).join(""):`<p class="muted">Ingen match spelad ännu.</p>`}</section>
 <section class="card"><h3>Nyheter</h3>${state.news.slice(0,5).map(n=>`<div class="row"><span>${n}</span></div>`).join("")}</section>
 <section class="card"><h3>Skadeläge</h3>${state.injuries.length?state.injuries.map(i=>{const p=state.roster.find(x=>x.id===i.id);return `<div class="row"><span>${p.name}</span><b>${i.games} matcher</b></div>`}).join(""):`<p class="muted">Truppen är skadefri.</p>`}</section>
 <section class="card"><h3>Klubbkassa</h3><h2 style="color:var(--accent)">${money(state.money)}</h2><button class="btn danger" onclick="resetGame()">Starta om karriären</button></section>`;
}
function squadView(){
 return `<section class="card"><div class="section-title"><div><h2>HV71-truppen</h2><p class="muted">${state.lineup.length}/18 uttagna</p></div><span class="pill">Tryck på spelare</span></div>
 ${state.roster.slice().sort((a,b)=>b.overall-a.overall).map(p=>`<div class="player" onclick="playerView(${p.id})"><span class="pos">${p.pos}</span><div class="info"><b>${p.name}</b><small>${p.age} år • POT ${p.potential}${state.lineup.includes(p.id)?" • UTTAGEN":""}${state.injuries.some(i=>i.id===p.id)?" • SKADAD":""}</small></div><span class="rating">${p.overall}</span></div>`).join("")}</section>`;
}
function playerView(id){
 const p=state.roster.find(x=>x.id===id),picked=state.lineup.includes(id);
 document.getElementById("content").innerHTML=`<section class="card hero"><span class="pill">${p.pos} • ${p.age} år</span><h2>${p.name}</h2><div class="grid"><div class="stat"><b>${p.overall}</b><span>OVR</span></div><div class="stat"><b>${p.potential}</b><span>Potential</span></div><div class="stat"><b>${p.g}</b><span>Mål</span></div><div class="stat"><b>${p.gp}</b><span>Matcher</span></div></div></section>
 <section class="card">${state.injuries.some(i=>i.id===p.id)?`<div class="line"><b>SKADAD</b><div>Beräknas missa ${state.injuries.find(i=>i.id===p.id).games} matcher</div></div>`:""}<h3>Egenskaper</h3>${[["Skott",p.shooting],["Skridskoåkning",p.skating],["Passningar",p.passing],["Defensiv",p.defense],["Fysik",p.physical]].map(x=>`<div class="row"><span>${x[0]}</span><b>${x[1]}</b></div>`).join("")}</section>
 <section class="card"><button class="btn ${picked?"danger":""}" onclick="toggle(${p.id});page='squad';render()">${picked?"Ta bort ur matchtruppen":"Ta ut till match"}</button><br><br><button class="btn secondary" onclick="page='squad';render()">Tillbaka</button></section>`;
 window.scrollTo(0,0);
}

function normalizeLines(){
 const healthy=state.roster.filter(p=>!state.injuries.some(i=>i.id===p.id));
 const fw=healthy.filter(p=>p.pos!=="MV"&&p.pos!=="B").sort((a,b)=>b.overall-a.overall);
 const d=healthy.filter(p=>p.pos==="B").sort((a,b)=>b.overall-a.overall);
 const g=healthy.filter(p=>p.pos==="MV").sort((a,b)=>b.overall-a.overall);

 if(!state.lines) state.lines={f:[],d:[],g:null};

 function repair(current,candidates,count){
   const validIds=candidates.map(p=>p.id);
   const used=new Set();
   const repaired=[];
   for(let i=0;i<count;i++){
     let id=Number(current?.[i]);
     if(!validIds.includes(id)||used.has(id)){
       id=validIds.find(x=>!used.has(x));
     }
     if(id!==undefined){
       repaired.push(id);
       used.add(id);
     }
   }
   return repaired;
 }

 state.lines.f=repair(state.lines.f,fw,Math.min(12,fw.length));
 state.lines.d=repair(state.lines.d,d,Math.min(6,d.length));
 if(!g.some(p=>p.id===Number(state.lines.g))) state.lines.g=g[0]?.id ?? null;

 save();
}

function linesView(){
 normalizeLines();
 const healthy=state.roster.filter(p=>!state.injuries.some(i=>i.id===p.id));
 const fw=healthy.filter(p=>p.pos!=="MV"&&p.pos!=="B").sort((a,b)=>b.overall-a.overall);
 const d=healthy.filter(p=>p.pos==="B").sort((a,b)=>b.overall-a.overall);
 const g=healthy.filter(p=>p.pos==="MV").sort((a,b)=>b.overall-a.overall);
 const option=(list,selectedId)=>list.map(p=>`<option value="${p.id}" ${p.id===selectedId?"selected":""}>${p.name} (${p.overall})</option>`).join("");
 let out=`<section class="card"><h2>Kedjor och backpar</h2><p class="muted">Välj spelare manuellt. Ändringarna sparas direkt.</p>`;
 for(let i=0;i<4;i++){
   out+=`<div class="line"><b>Kedja ${i+1}</b>
   <select onchange="setLine('f',${i*3},this.value)">${option(fw,state.lines.f[i*3])}</select><br><br>
   <select onchange="setLine('f',${i*3+1},this.value)">${option(fw,state.lines.f[i*3+1])}</select><br><br>
   <select onchange="setLine('f',${i*3+2},this.value)">${option(fw,state.lines.f[i*3+2])}</select></div>`;
 }
 for(let i=0;i<3;i++){
   out+=`<div class="line"><b>Backpar ${i+1}</b>
   <select onchange="setLine('d',${i*2},this.value)">${option(d,state.lines.d[i*2])}</select><br><br>
   <select onchange="setLine('d',${i*2+1},this.value)">${option(d,state.lines.d[i*2+1])}</select></div>`;
 }
 out+=`<div class="line"><b>Startande målvakt</b><select onchange="setGoalie(this.value)">${option(g,state.lines.g)}</select></div></section>`;
 return out;
}
function setLine(type,index,value){
 const id=Number(value);
 const arr=state.lines[type];
 const oldIndex=arr.indexOf(id);
 if(oldIndex>=0){const temp=arr[index];arr[index]=id;arr[oldIndex]=temp}
 else arr[index]=id;
 save();render();toast("Kedjan uppdaterad");
}
function setGoalie(value){state.lines.g=Number(value);save();toast("Målvakt vald")}


function setTactic(value){state.tactic=value;save();render();toast("Taktiken är ändrad")}
function tacticLabel(){return state.tactic==="attack"?"Offensiv":state.tactic==="defense"?"Defensiv":"Balanserad"}
function tacticBonus(){
 if(state.tactic==="attack")return 2.5;
 if(state.tactic==="defense")return -1.5;
 return 0;
}

function matchView(){
 const lm=state.liveMatch,l=state.lastMatch;
 if(lm){
   const progress=((lm.period-1)*20+lm.minute+lm.second/60)/60*100;
   const eventHtml=lm.events.map(e=>`<div class="${e.type==="goal"?"event-goal":e.type==="penalty"?"event-penalty":"event-info"}">${e.time} – ${e.text}</div>`).join("");
   return `<section class="card">
    <div class="section-title"><div><h2>Live: HV71–${lm.opp}</h2><p class="muted">Period ${lm.period} • ${lm.minute}:${String(lm.second).padStart(2,"0")}</p></div><span class="pill">${lm.running?"PÅGÅR":"PAUSAD"}</span></div>
    <div class="score">${lm.scoreHV}–${lm.scoreOpp}</div>
    <div class="livebar"><span style="width:${progress}%"></span></div>
    <div class="grid"><div class="stat"><b>${lm.shotsHV}–${lm.shotsOpp}</b><span>Skott</span></div><div class="stat"><b>${lm.ppHV}–${lm.ppOpp}</b><span>Powerplay</span></div><div class="stat"><b>${Math.round(lm.momentum)}%</b><span>HV71-momentum</span></div><div class="stat"><b>${tacticLabel()}</b><span>Taktik</span></div></div>
    <div class="controls">
      <button class="btn" onclick="${lm.running?"pauseLive()":"startLive()"}">${lm.running?"Pausa":"Fortsätt"}</button>
      <button class="btn secondary" onclick="useTimeout()" ${lm.timeoutUsed?"disabled style='opacity:.45'":""}>Timeout</button>
    </div><br>
    <label class="tiny">Hastighet</label>
    <select onchange="setSpeed(this.value)">
      <option value="1" ${lm.speed===1?"selected":""}>Normal</option>
      <option value="2" ${lm.speed===2?"selected":""}>Snabb</option>
      <option value="3" ${lm.speed===3?"selected":""}>Mycket snabb</option>
    </select><br><br>
    <label class="tiny">Taktik under matchen</label>
    <select onchange="changeLiveTactic(this.value)">
      <option value="attack" ${state.tactic==="attack"?"selected":""}>Offensiv</option>
      <option value="balanced" ${state.tactic==="balanced"?"selected":""}>Balanserad</option>
      <option value="defense" ${state.tactic==="defense"?"selected":""}>Defensiv</option>
    </select>
    <div class="controls">
      <button class="btn secondary" onclick="page='lines';render()">Ändra kedjor</button>
      <button class="btn ${lm.goaliePulled?"danger":"secondary"}" onclick="toggleGoaliePull()">${lm.goaliePulled?"Sätt in målvakt":"Ta ut målvakt"}</button>
    </div>
   </section>
   <section class="card"><h3>Matchhändelser</h3><div class="log">${eventHtml||"Matchen har precis börjat."}</div></section>`;
 }
 return `<section class="card"><h2>Nästa match</h2><div class="matchteams"><div><b>HV71</b><small class="muted">HEMMA</small></div><div class="score">–</div><div><b>${opponent()}</b><small class="muted">BORTA</small></div></div>
 <p class="muted">Lagstyrka ${Math.round(power())} • ${state.lineup.length}/18 uttagna</p>
 <label class="tiny">Starttaktik</label>
 <select onchange="setTactic(this.value)">
   <option value="attack" ${state.tactic==="attack"?"selected":""}>Offensiv – fler chanser, större risk</option>
   <option value="balanced" ${state.tactic==="balanced"?"selected":""}>Balanserad</option>
   <option value="defense" ${state.tactic==="defense"?"selected":""}>Defensiv – färre chanser, säkrare bakåt</option>
 </select><br><br>
 <button class="btn" onclick="createLiveMatch()" ${state.lineup.length<18?"disabled style='opacity:.45'":""}>Starta live-match</button></section>
 ${l?`<section class="card"><h3>Senaste matchen</h3><div class="matchteams"><b>HV71</b><div class="score">${l.my}–${l.them}</div><b>${l.opp}</b></div>
 <div class="grid"><div class="stat"><b>${l.shotsHV||0}–${l.shotsOpp||0}</b><span>Skott</span></div><div class="stat"><b>${l.ppHV||0}–${l.ppOpp||0}</b><span>Powerplay</span></div></div>
 <p class="muted">Publik ${l.attendance} • Intäkt ${money(l.income)}</p><div class="log">${l.events.length?l.events.join("<br>"):"Inga registrerade mål."}</div></section>`:""}`;
}
function tableView(){
 const sorted=state.teams.slice().sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga));
 return `<section class="card"><h2>SHL-tabellen</h2><table class="table"><thead><tr><th>#</th><th>Lag</th><th>Ma</th><th>+/−</th><th>P</th></tr></thead><tbody>${sorted.map((t,i)=>`<tr class="${t.name==="HV71"?"me":""}"><td>${i+1}</td><td>${t.name}</td><td>${t.gp}</td><td>${t.gf-t.ga}</td><td><b>${t.pts}</b></td></tr>`).join("")}</tbody></table></section>
 <section class="card"><h2>HV71:s poängliga</h2>${state.roster.slice().sort((a,b)=>(b.g+b.a)-(a.g+a.a)||b.g-a.g).slice(0,10).map((p,i)=>`<div class="row"><span>${i+1}. ${p.name}</span><b>${p.g} mål • ${p.g+p.a} poäng</b></div>`).join("")}</section>`;
}
function render(){
 const c=document.getElementById("content");
 c.innerHTML=page==="home"?homeView():page==="squad"?squadView():page==="lines"?linesView():page==="match"?matchView():tableView();
 document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));
 window.scrollTo(0,0);
}
document.querySelectorAll(".nav button").forEach(b=>b.addEventListener("click",()=>{page=b.dataset.page;render()}));
save();
render();
</script>
</body>
</html>
